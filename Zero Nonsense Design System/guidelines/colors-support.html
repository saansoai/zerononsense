<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="s" style="background:var(--zn-ink-black);color:var(--zn-archival-paper)">INK<br>#1E1C18</div>

<div class="s" style="background:var(--zn-red-deep);color:var(--zn-archival-paper)">RED DEEP<br>#C23517</div>
<div class="s" style="background:var(--zn-blue-deep);color:var(--zn-archival-paper)">BLUE DEEP<br>#3F76BE</div>
<div class="s" style="background:var(--zn-blue-sky-light);color:var(--zn-ink-black)">SKY LIGHT<br>#7FAEE8</div>
<div class="s" style="background:var(--zn-paper-shade);color:var(--zn-ink-black)">PAPER SHADE<br>#E6E2D0</div>
