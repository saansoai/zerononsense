<!-- @dsCard group="Colors" viewport="700x180" name="Glass & Transparency" subtitle="Frosted panels over sky — the website surface system" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;height:180px;background:url('../assets/sky-clouds-wide.jpg') center/cover;display:flex;gap:14px;align-items:center;padding:0 16px;font-family:var(--font-mono);color:var(--zn-archival-paper)}
.g{border-radius:var(--radius-lg);border:1px solid var(--glass-border);padding:14px 16px;font-size:12px;letter-spacing:.05em;box-shadow:var(--shadow-glass)}
a{color:var(--zn-archival-paper)}a:hover{color:var(--text-link-hover)}</style></head><body>
<div class="g" style="background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))">GLASS<br>14% paper · blur 14</div>
<div class="g" style="background:var(--glass-bg-strong);backdrop-filter:blur(var(--glass-blur-strong));-webkit-backdrop-filter:blur(var(--glass-blur-strong));color:var(--zn-ink-black)">GLASS STRONG<br>55% paper · blur 24</div>
<div class="g" style="background:transparent;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))">BLUR ONLY<br>border 1px 45%</div>
</body></html>
