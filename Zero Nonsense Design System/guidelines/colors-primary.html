<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

.s{display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.n{font-family:var(--font-serif);font-weight:700;font-size:18px;line-height:1.05}
.h{font-size:12px;letter-spacing:.1em}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style></head><body>
<div class="s" style="background:var(--zn-archival-paper);color:var(--zn-verification-stamp)"><span class="n">Archival Paper</span><span class="h">#F3F1E4</span></div>
<div class="s" style="background:var(--zn-verification-stamp);color:var(--zn-archival-paper)"><span class="n">Verification Stamp</span><span class="h">#E9461E</span></div>
<div class="s" style="background:var(--zn-blueprint-ink);color:var(--zn-archival-paper)"><span class="n">Blueprint Ink</span><span class="h">#5E97DF</span></div>
</body></html>
