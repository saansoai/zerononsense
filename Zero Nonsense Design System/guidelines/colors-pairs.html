<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;height:142px;background:var(--zn-paper-shade);font-family:var(--font-mono)}
.p{display:grid;place-items:center;border-radius:6px}.p span{font-family:var(--font-serif);font-weight:700;font-size:26px}
.l{position:absolute;bottom:6px;font-size:9px;letter-spacing:.08em}
.p{position:relative}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style></head><body>
<div class="p" style="background:var(--zn-archival-paper)"><span style="color:var(--zn-blueprint-ink)">Aa</span><i class="l" style="color:var(--zn-ink-black)">BLUE ON PAPER</i></div>
<div class="p" style="background:var(--zn-archival-paper)"><span style="color:var(--zn-verification-stamp)">Aa</span><i class="l" style="color:var(--zn-ink-black)">RED ON PAPER</i></div>
<div class="p" style="background:var(--zn-blueprint-ink)"><span style="color:var(--zn-archival-paper)">Aa</span><i class="l" style="color:var(--zn-archival-paper)">PAPER ON BLUE</i></div>
<div class="p" style="background:var(--zn-verification-stamp)"><span style="color:var(--zn-archival-paper)">Aa</span><i class="l" style="color:var(--zn-archival-paper)">PAPER ON RED</i></div>
</body></html>
